name: EAS Production Build

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  build:
    name: Build & Deploy (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS (Android)
        if: matrix.platform == 'android'
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_ASSET_BASE_URL: ${{ secrets.EXPO_PUBLIC_ASSET_BASE_URL }}

      - name: Build on EAS (iOS)
        if: matrix.platform == 'ios'
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_ASSET_BASE_URL: ${{ secrets.EXPO_PUBLIC_ASSET_BASE_URL }}
